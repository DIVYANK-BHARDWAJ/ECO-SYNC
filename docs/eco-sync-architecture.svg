<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#0b1220" rx="18"/><style>text{font-family:Arial,sans-serif;fill:#eef5ff}.h{font-size:28px;font-weight:700}.s{font-size:17px;font-weight:700}.t{font-size:14px;fill:#b9c9df}.b{fill:#132238;stroke:#4a78a8;stroke-width:2}.a{stroke:#79b7ff;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79b7ff"/></marker></defs><text x="35" y="45" class="h">Eco-Sync Nexus — System Architecture</text><text x="35" y="72" class="t">Simulation · Carbon-aware automation · Web3 settlement</text><rect x="30" y="105" width="260" height="185" rx="14" class="b"/><text x="50" y="137" class="s">Client Layer</text><text x="50" y="172" class="t">Next.js dashboard</text><text x="50" y="198" class="t">Simulation visualizations</text><text x="50" y="224" class="t">Wallet signature requests</text><text x="50" y="250" class="t">Responsive interface</text><rect x="340" y="105" width="260" height="185" rx="14" class="b"/><text x="360" y="137" class="s">Application Layer</text><text x="360" y="172" class="t">Next.js API routes</text><text x="360" y="198" class="t">Auth and business logic</text><text x="360" y="224" class="t">Energy simulation engine</text><text x="360" y="250" class="t">AI and notifications</text><rect x="650" y="105" width="230" height="185" rx="14" class="b"/><text x="670" y="137" class="s">Data Layer</text><text x="670" y="172" class="t">PostgreSQL</text><text x="670" y="198" class="t">Prisma ORM</text><text x="670" y="224" class="t">Users and schedules</text><text x="670" y="250" class="t">Settlement history</text><rect x="930" y="105" width="240" height="185" rx="14" class="b"/><text x="950" y="137" class="s">Blockchain Layer</text><text x="950" y="172" class="t">Web3 relayer</text><text x="950" y="198" class="t">EcoToken contract</text><text x="950" y="224" class="t">Ethereum Sepolia</text><text x="950" y="250" class="t">Testnet settlement</text><path d="M290 195H335M600 195H645M880 195H925" class="a"/><rect x="30" y="330" width="1140" height="250" rx="14" fill="#0f1b2c" stroke="#38516e" stroke-width="2"/><text x="50" y="365" class="s">Settlement Flow</text><g class="t"><text x="60" y="410">1. Generate simulated solar surplus</text><text x="60" y="445">2. Detect surplus and initiate an energy sale</text><text x="60" y="480">3. Request and verify the user's wallet signature</text><text x="620" y="410">4. Submit an authorized transaction through the relayer</text><text x="620" y="445">5. Record the blockchain transaction reference</text><text x="620" y="480">6. Persist and display the settlement result</text></g><text x="50" y="545" class="t">Prototype boundary: values are synthetic and database/blockchain operations are not assumed to be atomic.</text></svg>